name: isi_cmi_prep
description: ISI CMI Preparation App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^6.8.0
  file_selector: ^1.1.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_overlay_window: ^0.5.0
  flutter_riverpod: ^2.4.9
  flutter_timezone: ^5.1.0
  go_router: ^13.0.1
  path_provider: ^2.1.6
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.0
  timezone: ^0.11.1
  uuid: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#8E94F2"
  adaptive_icon_foreground: "assets/logo/logo_glyph.png"
  web:
    generate: true
    image_path: "assets/logo/logo.png"
    background_color: "#8E94F2"
    theme_color: "#8E94F2"